name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Instalar dependencias con el lockfile
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos TypeScript
        run: pnpm typecheck

      - name: Ejecutar pruebas unitarias
        run: pnpm test:unit

      - name: Ejecutar pruebas de integración con Testcontainers y PostgreSQL
        run: pnpm test:integration
