services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservations_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-reservations}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservations} -d ${POSTGRES_DB:-reservations}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-reservations}:${POSTGRES_PASSWORD:-reservations_local_only}@db:5432/${POSTGRES_DB:-reservations}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
